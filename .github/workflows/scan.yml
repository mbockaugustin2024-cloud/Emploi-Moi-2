name: Job Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

concurrency:
  group: job-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      BREVO_EMAIL: ${{ secrets.BREVO_EMAIL }}

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Requalifier les offres existantes
        run: python src/requalify.py

      - name: Scanner les offres
        run: python src/scanner.py

      - name: Générer les CV et lettres
        run: python src/documents.py
