name: Job Scanner

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

concurrency:
  group: job-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY_LITE: ${{ secrets.GEMINI_API_KEY_LITE }}
      GEMINI_API_KEY_37: ${{ secrets.GEMINI_API_KEY_37 }}
      GEMINI_API_KEY_38: ${{ secrets.GEMINI_API_KEY_38 }}
      BREVO_EMAIL: ${{ secrets.BREVO_EMAIL }}

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Scanner les offres
        run: python src/scanner.py

      - name: Générer les CV et lettres
        run: python src/documents.py
